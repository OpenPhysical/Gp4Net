name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required for GitVersioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test (act)
      if: env.ACT == 'true'
      env:
        VSTEST_CONNECTION_TIMEOUT: 1800
      run: dotnet test tests/Gp4Net.Tests/Gp4Net.Tests.csproj --no-build --configuration Release --logger trx --results-directory TestResults --filter "Category=Unit" --settings act.runsettings /p:CollectCoverage=false

    - name: Test and validate coverage
      if: env.ACT != 'true'
      run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults /p:CollectCoverage=true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() && env.ACT != 'true'
      with:
        name: test-results-${{ matrix.os }}
        path: |
          TestResults/
          tests/coverage/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && env.ACT != 'true' && env.CODECOV_TOKEN != ''
      with:
        directory: tests/coverage/
        fail_ci_if_error: true
        flags: unittests
        name: codecov-${{ matrix.os }}
        token: ${{ secrets.CODECOV_TOKEN }}

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Pack
      run: dotnet pack --no-build --configuration Release --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
